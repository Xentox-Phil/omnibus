[project]
name = "omnibus-analysis"
version = "0.1.0"
description = "RVV transit data pipeline for Hackaburg 2026 Omnibus project"
requires-python = ">=3.11"
dependencies = [
    "eclipse-sumo>=1.27.0",
    "lightgbm>=4.6,<5",
    "pandas>=3.0.3",
    "polars==1.41.1",
    "pyarrow>=18",
    "pyproj>=3.7.2",
    "rtree>=1.4.1",
    "sumolib>=1.27.0",
    "traci>=1.27.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "folium>=0.20.0",
    "jupyterlab>=4.5.7",
    "matplotlib>=3.10.9",
    "nbstripout>=0.9.1",
]
