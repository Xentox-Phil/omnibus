[project]
name = "omnibus-analysis"
version = "0.1.0"
description = "RVV transit data pipeline for Hackaburg 2026 Omnibus project"
requires-python = ">=3.11"
dependencies = [
    "polars==1.41.1",
    "pyarrow>=18",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "folium>=0.20.0",
    "jupyterlab>=4.5.7",
    "matplotlib>=3.10.9",
    "nbstripout>=0.9.1",
]
